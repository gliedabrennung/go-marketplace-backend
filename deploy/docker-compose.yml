name: marketplace

x-app-env: &app-env
  APP_ENV: dev
  LOG_LEVEL: debug
  DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
  REDIS_ADDR: redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  S3_BUCKET: marketplace
  S3_ACCESS_KEY: marketplace
  S3_SECRET_KEY: marketplace-secret
  IDENTITY_DEV_REVEAL_CODES: "true"
  PSP_PROVIDER: sandbox
  PSP_BASE_URL: http://api:8080/sandbox/psp
  PSP_API_KEY: sandbox-api-key
  PSP_WEBHOOK_SECRET: sandbox-webhook-secret
  PSP_SANDBOX_PUBLIC_URL: http://localhost:8080/sandbox/psp
  PSP_SANDBOX_WEBHOOK_URL: http://api:8080/webhooks/payments/sandbox
  CHECKOUT_RETURN_URL: http://localhost:3000/checkout/result
  ORDER_RETURN_WINDOW: 336h
  SHIPPING_FLAT_FEE: "99000"
  SHIPPING_FREE_THRESHOLD: "1500000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: ..
      args:
        SERVICE: migrate
    command: ["up"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ..
      args:
        SERVICE: api
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ..
      args:
        SERVICE: worker
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:

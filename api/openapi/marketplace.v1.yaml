      tags: [inventory]
      operationId: setOfferStock
      description: Устанавливает доступный остаток оффера; разница пишется в журнал движений с причиной correction.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
                reference: { type: string, description: "Ключ синхронизации; повтор с тем же ключом не создаёт движение" }
      responses:
        "200":
          description: Текущий остаток
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [inventory]
      operationId: getOfferStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Остаток оффера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/offers/{id}/stock/movements:
    get:
      tags: [inventory]
      operationId: listStockMovements
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Последние движения остатка
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockMovement" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/sellers/{seller_id}/stock:
    get:
      tags: [inventory]
      operationId: listSellerStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SellerPathID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Остатки продавца в порядке SKU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/reservations/{id}:
    get:
      tags: [inventory]
      operationId: getReservation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Резерв по позициям
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pricing/quote:
    post:
      tags: [pricing]
      operationId: quotePrices
      description: "Котировка позиций с акциями и промокодом; для авторизованного покупателя проверяется лимит промокода на покупателя."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: Котировка с детализацией скидок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/seller/offers/{id}/compare-at-price:
    put:
      tags: [pricing]
      operationId: setCompareAtPrice
      description: Устанавливает цену до скидки; 0 снимает её.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compare_at]
              properties:
                compare_at: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: Цена до скидки сохранена }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/pricing/promotions:
    post:
      tags: [pricing-admin]
      operationId: createPromotion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "201":
          description: Акция создана в статусе draft
          content:
            application/json:
              schema:
                type: object
                required: [promotion_id]
                properties:
                  promotion_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [pricing-admin]
      operationId: listPromotions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, paused, ended] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Акции, новые первыми
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/pricing/promotions/{id}:
    get:
      tags: [pricing-admin]
      operationId: getPromotion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Акция
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [pricing-admin]
      operationId: updatePromotion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "204": { description: Акция обновлена }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/admin/pricing/promotions/{id}/status:
    put:
      tags: [pricing-admin]
      operationId: setPromotionStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, ended] }
      responses:
        "204": { description: Статус акции изменён }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/admin/pricing/promo-codes:
    post:
      tags: [pricing-admin]
      operationId: createPromoCode
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeInput" }
      responses:
        "201":
          description: Промокод создан
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/pricing/promo-codes/{code}:
    get:
      tags: [pricing-admin]
      operationId: getPromoCode
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PromoCodePath"
      responses:
        "200":
          description: Промокод со счётчиком применений
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/pricing/promo-codes/{code}/status:
    put:
      tags: [pricing-admin]
      operationId: setPromoCodeStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PromoCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "204": { description: Статус промокода изменён }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/cart:
    get:
      tags: [cart]
      operationId: getCart
      description: "Корзина авторизованного пользователя или устройства из X-Device-ID с актуальными ценами, наличием и доставкой по продавцам."
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      description: Добавляет оффер или увеличивает количество позиции.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity]
              properties:
                sku: { type: string, description: ID оффера }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/cart/items/{sku}:
    patch:
      tags: [cart]
      operationId: updateCartItem
      description: Меняет количество позиции; 0 удаляет позицию.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/SKUPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [cart]
      operationId: removeCartItem
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/SKUPath"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cart/promo-code:
    post:
      tags: [cart]
      operationId: applyCartPromoCode
      description: Сохраняет промокод, если котировка корзины его принимает.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [cart]
      operationId: removeCartPromoCode
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
  /api/v1/cart/checkout-preview:
    post:
      tags: [cart]
      operationId: previewCheckout
      description: Корзина с расчётом доставки выбранным способом и признаком готовности к оформлению.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_method: { type: string, enum: [standard] }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/cart/merge:
    post:
      tags: [cart]
      operationId: mergeCart
      description: Переносит анонимную корзину устройства в корзину пользователя после входа.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/orders:
    post:
      tags: [orders]
      operationId: placeOrder
      description: "Оформляет заказ из корзины: резерв остатка, фиксация цен и промокода, создание платежа. Ответ содержит ссылку на страницу оплаты."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "201":
          description: Заказ ожидает оплаты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      tags: [orders]
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Заказы покупателя, новые первыми
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderSummary" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      description: "Отмена покупателем или поддержкой до передачи в доставку; после оплаты выполняется возврат средств."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Платёж с возвратами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/payments/{id}/retry:
    post:
      tags: [payments]
      operationId: retryPayment
      description: Новая попытка оплаты заказа после отказа, пока не истёк срок оплаты.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ссылка на оплату
          content:
            application/json:
              schema:
                type: object
                required: [order_id, payment_id, payment_url]
                properties:
                  order_id: { type: string, format: uuid }
                  payment_id: { type: string, format: uuid }
                  payment_url: { type: string, format: uri }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/me/payment-methods:
    get:
      tags: [payments]
      operationId: listPaymentMethods
      description: Сохранённые способы оплаты; хранятся только токены провайдера.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Способы оплаты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, provider, label, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        provider: { type: string }
                        label: { type: string }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/payment-methods/{id}:
    delete:
      tags: [payments]
      operationId: removePaymentMethod
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Способ оплаты удалён }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/orders:
    get:
      tags: [seller-orders]
      operationId: listSellerOrders
      description: Оплаченные и отменённые заказы с позициями продавца, без адреса покупателя.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: seller_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrderStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Заказы продавца
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SellerOrder" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/orders/{id}/ship:
    post:
      tags: [seller-orders]
      operationId: shipOrder
      description: "Продавец отмечает заказ переданным в доставку (paid/in_fulfilment → shipped). Этап 4: ручная отметка вместо интеграции с логистикой (ADR-0018)."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Заказ помечен как переданный в доставку }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/seller/orders/{id}/deliver:
    post:
      tags: [seller-orders]
      operationId: deliverOrder
      description: Продавец отмечает заказ доставленным (shipped → delivered); отсчитывает срок возврата до автоматического завершения заказа.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Заказ помечен как доставленный }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/seller/settlements:
    get:
      tags: [settlement]
      operationId: getSellerSettlements
      description: "Начисления продавцу за завершённые заказы (за вычетом комиссии) и итоги за месяц. Этап 4: отчёт без реестра выплат (ADR-0018)."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: seller_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          required: true
          description: Календарный месяц в формате YYYY-MM
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: Отчёт продавца за период
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/checkout-sagas:
    get:
      tags: [support]
      operationId: listCheckoutSagas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [running, compensating, completed, compensated, manual] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Саги оформления, недавно изменённые первыми
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CheckoutSaga" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/checkout-sagas/{id}/resume:
    post:
      tags: [support]
      operationId: resumeCheckoutSaga
      description: Возобновляет компенсации саги в статусе manual.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Компенсации выполнены }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/payments/reconciliations/{day}:
    get:
      tags: [support]
      operationId: getReconciliation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: day
          in: path
          required: true
          schema: { type: string, format: date }
        - name: provider
          in: query
          schema: { type: string, default: sandbox }
      responses:
        "200":
          description: Отчёт сверки с провайдером
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/payments/{provider}:
    post:
      tags: [webhooks]
      operationId: receivePaymentWebhook
      description: "Вебхук провайдера: подпись в заголовке провайдера (для эмулятора X-Sandbox-Signature: t=<unix>,v1=<hex>), окно ±5 минут, allowlist адресов, тело до 64 КБ."
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Событие принято
          content:
            application/json:
              schema:
                type: object
                required: [received, duplicate]
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeviceID:
      name: X-Device-ID
      in: header
      description: Идентификатор устройства для анонимной корзины
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
    SKUPath:
      name: sku
      in: path
      required: true
      schema: { type: string }
    OrderStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [created, awaiting_payment, paid, in_fulfilment, shipped, delivered, completed, cancelled, failed, returning, returned]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryID:
      name: category_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttributeCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    SellerPathID:
      name: seller_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageID:
      name: image_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductPathID:
      name: product_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PromoCodePath:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9-]{4,32}$" }
  headers:
    RetryAfter:
      schema: { type: integer }
      description: Секунды до повторной попытки
  responses:
    Cart:
      description: Корзина
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }
    Order:
      description: Заказ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Order" }
    Tokens:
      description: Выданные токены
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Tokens" }
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Операция запрещена
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Конфликт состояния
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Нарушено бизнес-правило
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable, draining] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, failing] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
    Reason:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    Rate:
      type: object
      required: [basis_points]
      properties:
        basis_points: { type: integer, minimum: 0, maximum: 10000, description: "1% = 100" }
    Tokens:
      type: object
      required: [token_type, user_id, session_id, access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        token_type: { type: string, enum: [Bearer] }
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, email, email_verified, roles, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        roles:
          type: array
          items: { type: string }
        status: { type: string, enum: [pending_verification, active, blocked] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [id, device_name, user_agent, ip, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    LegalDetails:
      type: object
      required: [legal_form, legal_name, tax_id, legal_address]
      properties:
        legal_form: { type: string, enum: [legal_entity, sole_proprietor] }
        legal_name: { type: string }
        tax_id: { type: string, pattern: "^[0-9]{12}$", description: БИН или ИИН }
        legal_address: { type: string }
    SellerSummary:
      type: object
      required: [id, status, legal_name, tax_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        legal_name: { type: string }
        tax_id: { type: string }
        role: { type: string, enum: [seller_admin, seller_operator] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Seller:
      type: object
      required: [id, owner_id, status, legal_form, legal_name, tax_id, legal_address, documents, members, commission_overrides, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending_review, active, suspended, terminated] }
        legal_form: { type: string }
        legal_name: { type: string }
        tax_id: { type: string }
        legal_address: { type: string }
        bank_account:
          type: object
          properties:
            masked_iban: { type: string }
            bic: { type: string }
            bank_name: { type: string }
            verified: { type: boolean }
        documents:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              object_key: { type: string }
              uploaded_at: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              role: { type: string }
              added_at: { type: string, format: date-time }
        commission_overrides:
          type: object
          additionalProperties: { type: integer }
        rating:
          type: object
          properties:
            score: { type: integer, minimum: 0, maximum: 100 }
            provisional: { type: boolean }
            orders: { type: integer }
            calculated_at: { type: string, format: date-time }
        rejection_reason: { type: string }
        suspension_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryNode:
      type: object
      required: [id, name, slug, depth]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        depth: { type: integer, minimum: 1, maximum: 6 }
    Attribute:
      type: object
      required: [code, name, type, required, filterable, category_id]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [string, number, boolean, enum, unit] }
        required: { type: boolean }
        filterable: { type: boolean }
        options:
          type: array
          items: { type: string }
        unit: { type: string }
        category_id: { type: string, format: uuid, description: Категория, в которой атрибут определён }
    Category:
      type: object
      required: [id, name, slug, path, attributes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        path:
          type: array
          items: { $ref: "#/components/schemas/CategoryNode" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/Attribute" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductContent:
      type: object
      required: [title]
      properties:
        category_id: { type: string, format: uuid, description: Обязателен при создании; при обновлении игнорируется }
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 10000 }
        brand: { type: string, maxLength: 100 }
        attributes:
          type: object
          additionalProperties: { type: string }
    ProductAttribute:
      type: object
      required: [code, name, type, value]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string }
        value: { type: string }
        unit: { type: string }
    ProductImage:
      type: object
      required: [id, status, content_type]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_upload, uploaded, processed] }
        content_type: { type: string }
        width: { type: integer }
        height: { type: integer }
        original_url: { type: string, format: uri, description: Только для владельца и модератора }
        small_url: { type: string, format: uri }
        large_url: { type: string, format: uri }
    ProductVariants:
      type: object
      required: [group_id, axes, members]
      properties:
        group_id: { type: string, format: uuid }
        axes:
          type: array
          items: { type: string }
        members:
          type: array
          items:
            type: object
            required: [product_id, axis_values]
            properties:
              product_id: { type: string, format: uuid }
              axis_values:
                type: object
                additionalProperties: { type: string }
    Product:
      type: object
      required: [id, category_id, seller_id, title, status, attributes, images, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        brand: { type: string }
        status: { type: string, enum: [draft, on_moderation, published, rejected] }
        rejection_reason: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ProductAttribute" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductImage" }
        variants: { $ref: "#/components/schemas/ProductVariants" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    ProductSummary:
      type: object
      required: [id, category_id, seller_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        title: { type: string }
        brand: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }
    OfferTerms:
      type: object
      required: [price, condition]
      properties:
        product_id: { type: string, format: uuid, description: Обязателен при создании оффера }
        seller_sku: { type: string, maxLength: 64, description: Обязателен при создании оффера }
        price: { type: integer, format: int64, minimum: 1, description: Минорные единицы валюты }
        currency: { type: string, default: KZT }
        condition: { type: string, enum: [new, used, refurbished] }
        processing_days: { type: integer, minimum: 0, maximum: 30 }
    Offer:
      type: object
      required: [id, product_id, seller_id, seller_sku, price, currency, condition, processing_days, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        seller_sku: { type: string }
        price: { type: integer, format: int64 }
        currency: { type: string }
        condition: { type: string, enum: [new, used, refurbished] }
        processing_days: { type: integer }
        status: { type: string, enum: [active, paused, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OfferPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Offer" }
        page: { $ref: "#/components/schemas/PageInfo" }
    UploadTarget:
      type: object
      required: [method, url, expires_at]
      properties:
        method: { type: string, enum: [PUT] }
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
    ImportRow:
      type: object
      required: [seller_sku, product_id, price, condition, processing_days]
      properties:
        seller_sku: { type: string }
        product_id: { type: string, format: uuid }
        price: { type: string }
        currency: { type: string }
        condition: { type: string, enum: [new, used, refurbished] }
        processing_days: { type: string }
        status: { type: string, enum: [active, paused] }
    ImportJob:
      type: object
      required: [id, seller_id, format, status, total_rows, succeeded_rows, failed_rows, created_at]
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        format: { type: string, enum: [csv, xlsx, json] }
        status: { type: string, enum: [pending, processing, completed, failed] }
        total_rows: { type: integer }
        succeeded_rows: { type: integer }
        failed_rows: { type: integer }
        failure_reason: { type: string }
        report_url: { type: string, format: uri }
        errors:
          type: array
          items:
            type: object
            required: [row, code, message]
            properties:
              row: { type: integer }
              field: { type: string }
              code: { type: string }
              message: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ImportJobPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ImportJob" }
        page: { $ref: "#/components/schemas/PageInfo" }
    SearchHit:
      type: object
      required: [product_id, seller_id, category_id, title, min_price, currency, offers, sellers, in_stock, published_at]
      properties:
        product_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        title: { type: string }
        brand: { type: string }
        cover_key: { type: string }
        min_price: { type: integer, format: int64 }
        currency: { type: string }
        offers: { type: integer }
        sellers: { type: integer }
        in_stock: { type: boolean }
        published_at: { type: string, format: date-time }
        rank: { type: number, format: double }
    SearchResult:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        page: { $ref: "#/components/schemas/PageInfo" }
        corrected_query: { type: string, description: Заполняется, если исходный запрос не дал результатов и был исправлен }
    Facets:
      type: object
      required: [total, price_min, price_max, attributes, numbers, conditions]
      properties:
        total: { type: integer }
        price_min: { type: integer, format: int64 }
        price_max: { type: integer, format: int64 }
        attributes:
          type: array
          items:
            type: object
            required: [code, values]
            properties:
              code: { type: string }
              values:
                type: array
                items:
                  type: object
                  required: [value, count]
                  properties:
                    value: { type: string }
                    count: { type: integer }
        numbers:
          type: array
          items:
            type: object
            required: [code, min, max]
            properties:
              code: { type: string }
              min: { type: number }
              max: { type: number }
        conditions:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: string }
              count: { type: integer }
    ReindexJob:
      type: object
      required: [id, status, target, processed, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, completed, failed] }
        target: { type: string, enum: [documents_a, documents_b] }
        processed: { type: integer }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Stock:
      type: object
      required: [sku, available, reserved, updated_at]
      properties:
        sku: { type: string }
        seller_id: { type: string, format: uuid }
        available: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    StockPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Stock" }
        page: { $ref: "#/components/schemas/PageInfo" }
    StockMovement:
      type: object
      required: [sku, delta, reason, reference_id, occurred_at]
      properties:
        sku: { type: string }
        delta: { type: integer, description: Изменение физического остатка }
        reason: { type: string, enum: [reserve, release, commit, restock, return, correction] }
        reference_id: { type: string }
        occurred_at: { type: string, format: date-time }
    Reservation:
      type: object
      required: [reservation_id, status, expires_at, lines]
      properties:
        reservation_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [held, committed, released, expired] }
        expires_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [sku, quantity, status]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
              status: { type: string }
    DiscountSpec:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [percentage, fixed, buy_n_get_m] }
        basis_points: { type: integer, minimum: 1, maximum: 10000 }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, default: KZT }
        buy_quantity: { type: integer, minimum: 2 }
        free_units: { type: integer, minimum: 1 }
    PromotionTarget:
      type: object
      properties:
        skus:
          type: array
          items: { type: string }
        sellers:
          type: array
          items: { type: string, format: uuid }
        categories:
          type: array
          items: { type: string, format: uuid }
    PromotionInput:
      type: object
      required: [name, discount, target]
      properties:
        name: { type: string, maxLength: 200 }
        discount: { $ref: "#/components/schemas/DiscountSpec" }
        target: { $ref: "#/components/schemas/PromotionTarget" }
        priority: { type: integer }
        exclusive: { type: boolean }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    Promotion:
      allOf:
        - $ref: "#/components/schemas/PromotionInput"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, active, paused, ended] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PromotionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Promotion" }
        page: { $ref: "#/components/schemas/PageInfo" }
    PromoCodeInput:
      type: object
      required: [code, discount]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9-]{4,32}$" }
        discount: { $ref: "#/components/schemas/DiscountSpec" }
        min_cart_amount: { type: integer, format: int64, minimum: 0 }
        total_limit: { type: integer, minimum: 0, description: 0 — без ограничения }
        per_customer_limit: { type: integer, minimum: 0, description: 0 — без ограничения }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    PromoCode:
      allOf:
        - $ref: "#/components/schemas/PromoCodeInput"
        - type: object
          required: [used, status, created_at, updated_at]
          properties:
            used: { type: integer }
            status: { type: string, enum: [active, disabled] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    QuoteRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
        promo_code: { type: string }
    Quote:
      type: object
      required: [lines, subtotal, discount, total, currency]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [sku, seller_id, product_id, quantity, unit_price, base, discounts, final]
            properties:
              sku: { type: string }
              seller_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              quantity: { type: integer }
              unit_price: { type: integer, format: int64 }
              compare_at: { type: integer, format: int64 }
              base: { type: integer, format: int64 }
              final: { type: integer, format: int64 }
              discounts:
                type: array
                items:
                  type: object
                  required: [rule_id, kind, amount]
                  properties:
                    rule_id: { type: string }
                    kind: { type: string, enum: [percentage, fixed, buy_n_get_m, promo_code] }
                    amount: { type: integer, format: int64 }
                    promo_code: { type: string }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        currency: { type: string }
        promo_code: { type: string }
    Cart:
      type: object
      required: [delivery_method, groups, items_count, subtotal, discount, shipping, total, issues, ready]
      properties:
        cart_id: { type: string, format: uuid }
        currency: { type: string }
        promo_code: { type: string }
        promo_error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        delivery_method: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [seller_id, items, subtotal, discount, shipping, total]
            properties:
              seller_id: { type: string, format: uuid }
              subtotal: { type: integer, format: int64 }
              discount: { type: integer, format: int64 }
              shipping: { type: integer, format: int64 }
              total: { type: integer, format: int64 }
              items:
                type: array
                items:
                  type: object
                  required: [sku, quantity, available, status, unit_price, saved_price, price_changed, subtotal, discount, total]
                  properties:
                    sku: { type: string }
                    product_id: { type: string }
                    title: { type: string }
                    cover_key: { type: string }
                    quantity: { type: integer }
                    available: { type: integer }
                    status: { type: string, enum: [available, insufficient_stock, unavailable] }
                    unit_price: { type: integer, format: int64 }
                    saved_price: { type: integer, format: int64 }
                    price_changed: { type: boolean }
                    compare_at: { type: integer, format: int64 }
                    subtotal: { type: integer, format: int64 }
                    discount: { type: integer, format: int64 }
                    total: { type: integer, format: int64 }
        items_count: { type: integer }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        shipping: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        issues:
          type: array
          items:
            type: object
            required: [sku, code]
            properties:
              sku: { type: string }
              code: { type: string, enum: [CART_OFFER_UNAVAILABLE, CART_QUANTITY_EXCEEDS_STOCK] }
        ready: { type: boolean }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    Address:
      type: object
      required: [recipient, phone, city, line]
      properties:
        recipient: { type: string, maxLength: 200 }
        phone: { type: string, description: 10–15 цифр, допускаются пробелы, скобки и дефисы }
        country: { type: string, default: KZ, minLength: 2, maxLength: 2 }
        city: { type: string, maxLength: 100 }
        line: { type: string, maxLength: 300 }
        postal_code: { type: string, maxLength: 20 }
    PlaceOrderRequest:
      type: object
      required: [address]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        delivery_method: { type: string, enum: [standard], default: standard }
        payment:
          type: object
          properties:
            method_id: { type: string, format: uuid, description: Сохранённый способ оплаты }
            save_method: { type: boolean, description: Сохранить токен способа оплаты после успешной оплаты }
        expected_total: { type: integer, format: int64, description: Итог из предпросмотра; при расхождении — ORDER_TOTAL_CHANGED }
    PlacedOrder:
      type: object
      required: [order_id, status, payment_id, payment_url, total, currency]
      properties:
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment] }
        payment_id: { type: string, format: uuid }
        payment_url: { type: string, format: uri }
        total: { type: integer, format: int64 }
        currency: { type: string }
    OrderItem:
      type: object
      required: [sku, product_id, seller_id, title, quantity, unit_price, subtotal, discount, total]
      properties:
        sku: { type: string }
        product_id: { type: string }
        seller_id: { type: string, format: uuid }
        title: { type: string }
        quantity: { type: integer }
        unit_price: { type: integer, format: int64 }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    OrderPart:
      type: object
      required: [seller_id, subtotal, discount, shipping, total]
      properties:
        seller_id: { type: string, format: uuid }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        shipping: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    Order:
      type: object
      required: [id, status, address, delivery_method, currency, subtotal, discount, shipping, total, items, parts, history, cancellable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        address: { $ref: "#/components/schemas/Address" }
        delivery_method: { type: string }
        promo_code: { type: string }
        currency: { type: string }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        shipping: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/OrderPart" }
        history:
          type: array
          items:
            type: object
            required: [to, actor, at]
            properties:
              from: { type: string }
              to: { type: string }
              actor: { type: string, enum: [buyer, seller, support, system] }
              reason: { type: string }
              at: { type: string, format: date-time }
        payment:
          type: object
          required: [payment_id, status]
          properties:
            payment_id: { type: string, format: uuid }
            status: { type: string, enum: [created, pending, authorized, captured, failed, cancelled, refunded] }
            redirect_url: { type: string, format: uri }
            pay_before: { type: string, format: date-time }
        cancellable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderSummary:
      type: object
      required: [id, status, currency, total, items_count, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        currency: { type: string }
        total: { type: integer, format: int64 }
        items_count: { type: integer }
        created_at: { type: string, format: date-time }
    SellerOrder:
      type: object
      required: [id, status, currency, items, part, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        currency: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        part: { $ref: "#/components/schemas/OrderPart" }
        created_at: { type: string, format: date-time }
    CheckoutSaga:
      type: object
      required: [order_id, buyer_id, status, step, reservation_id, payment_id, attempts, compensated, deadline, updated_at]
      properties:
        order_id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        status: { type: string, enum: [running, compensating, completed, compensated, manual] }
        step: { type: string }
        reservation_id: { type: string }
        payment_id: { type: string }
        reason: { type: string }
        last_error: { type: string }
        attempts: { type: integer }
        compensated:
          type: array
          items: { type: string, enum: [cancel_payment, refund_payment, return_stock, release_promo, close_order] }
        deadline: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, order_id, provider, status, currency, amount, authorized, captured, refunded, refunds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        provider: { type: string }
        status: { type: string, enum: [created, pending, authorized, captured, failed, cancelled, refunded] }
        currency: { type: string }
        amount: { type: integer, format: int64 }
        authorized: { type: integer, format: int64 }
        captured: { type: integer, format: int64 }
        refunded: { type: integer, format: int64 }
        redirect_url: { type: string, format: uri }
        failure_reason: { type: string }
        refunds:
          type: array
          items:
            type: object
            required: [id, amount, status, created_at]
            properties:
              id: { type: string, format: uuid }
              amount: { type: integer, format: int64 }
              reason: { type: string }
              status: { type: string, enum: [pending, succeeded, failed] }
              created_at: { type: string, format: date-time }
              completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Reconciliation:
      type: object
      required: [day, provider, checked, mismatches, created_at]
      properties:
        day: { type: string, format: date }
        provider: { type: string }
        checked: { type: integer }
        mismatches:
          type: array
          items:
            type: object
            required: [provider_payment_id, field, internal, provider]
            properties:
              payment_id: { type: string, format: uuid }
              provider_payment_id: { type: string }
              field: { type: string, enum: [presence, captured, refunded] }
              internal: { type: string }
              provider: { type: string }
        created_at: { type: string, format: date-time }
    SettlementEntry:
      type: object
      required: [id, order_id, currency, gross, commission, net, accrued_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        currency: { type: string }
        gross: { type: integer, format: int64 }
        commission: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        accrued_at: { type: string, format: date-time }
    SettlementReport:
      type: object
      required: [seller_id, from, to, entries, gross, commission, net]
      properties:
        seller_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        currency: { type: string }
        gross: { type: integer, format: int64 }
        commission: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SettlementEntry" }

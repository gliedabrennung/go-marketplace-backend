openapi: 3.1.0
info:
  title: Marketplace API
  version: 1.0.0
  description: Публичный REST API маркетплейса. Контракт является источником правды (contract-first).
servers:
  - url: https://api.marketplace.kz
  - url: http://localhost:8080
tags:
  - name: service
  - name: auth
  - name: me
  - name: identity-admin
  - name: seller
  - name: seller-admin
  - name: seller-catalog
  - name: catalog
  - name: catalog-admin
  - name: search
  - name: search-admin
  - name: inventory
  - name: pricing
  - name: pricing-admin
  - name: cart
  - name: orders
  - name: seller-orders
  - name: settlement
  - name: payments
  - name: support
  - name: webhooks
paths:
  /healthz:
    get:
      tags: [service]
      operationId: liveness
      responses:
        "200":
          description: Процесс жив
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [service]
      operationId: readiness
      responses:
        "200":
          description: Инстанс готов принимать трафик
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Зависимость недоступна или инстанс выводится из балансировки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/auth/email/register:
    post:
      tags: [auth]
      operationId: registerWithEmail
      description: Регистрирует покупателя и отправляет ссылку подтверждения. Не более 3 писем за 10 минут на email. Повторная регистрация неподтверждённого email выдаёт новую ссылку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201":
          description: Пользователь создан, письмо отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/email/confirm:
    post:
      tags: [auth]
      operationId: confirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email подтверждён }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/auth/email/sign-in:
    post:
      tags: [auth]
      operationId: signInWithEmail
      description: Вход только с подтверждённым email. Не более 5 попыток за 15 минут на email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      description: Ротирует refresh-токен. Повторное использование старого токена отзывает сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Текущая сессия отозвана }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Активные сессии
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Сессия отозвана }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/users/{id}/block:
    post:
      tags: [identity-admin]
      operationId: blockUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "204": { description: Пользователь заблокирован }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/admin/users/{id}/unblock:
    post:
      tags: [identity-admin]
      operationId: unblockUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Пользователь разблокирован }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/admin/users/{id}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum: [buyer, content_moderator, support_agent, platform_admin]
    put:
      tags: [identity-admin]
      operationId: grantRole
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Роль выдана }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [identity-admin]
      operationId: revokeRole
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Роль отозвана }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/seller/applications:
    post:
      tags: [seller]
      operationId: openSellerApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalDetails" }
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  seller_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/seller/sellers:
    get:
      tags: [seller]
      operationId: listMySellers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Продавцы, где пользователь — сотрудник
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SellerSummary" }
  /api/v1/seller/sellers/{id}:
    get:
      tags: [seller]
      operationId: getSeller
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Продавец
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/sellers/{id}/legal-details:
    put:
      tags: [seller]
      operationId: updateLegalDetails
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalDetails" }
      responses:
        "204": { description: Реквизиты обновлены }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/seller/sellers/{id}/bank-account:
    put:
      tags: [seller]
      operationId: changeBankAccount
      description: Смена банковских реквизитов блокирует выплаты до повторной верификации.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban, bic, bank_name, beneficiary]
              properties:
                iban: { type: string, example: KZ86125KZT5004100100 }
                bic: { type: string, example: HSBKKZKX }
                bank_name: { type: string }
                beneficiary: { type: string }
      responses:
        "204": { description: Реквизиты изменены }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/sellers/{id}/documents:
    post:
      tags: [seller]
      operationId: attachSellerDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, object_key]
              properties:
                kind:
                  type: string
                  enum: [registration_certificate, charter, bank_confirmation, identity_document]
                object_key: { type: string }
      responses:
        "204": { description: Документ прикреплён }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/seller/sellers/{id}/submit:
    post:
      tags: [seller]
      operationId: submitSellerApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Заявка отправлена на модерацию }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/seller/sellers/{id}/members:
    post:
      tags: [seller]
      operationId: addSellerMember
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
                role: { type: string, enum: [seller_admin, seller_operator] }
      responses:
        "204": { description: Сотрудник добавлен }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/seller/sellers/{id}/members/{user_id}:
    delete:
      tags: [seller]
      operationId: removeSellerMember
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Сотрудник удалён }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/seller-applications:
    get:
      tags: [seller-admin]
      operationId: listSellerApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, active, suspended, terminated]
            default: pending_review
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Очередь модерации (старые первыми)
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SellerSummary" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sellers/{id}:
    get:
      tags: [seller-admin]
      operationId: getSellerAsStaff
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Продавец
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seller" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/sellers/{id}/approve:
    post:
      tags: [seller-admin]
      operationId: approveSellerApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Заявка одобрена }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sellers/{id}/reject:
    post:
      tags: [seller-admin]
      operationId: rejectSellerApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "204": { description: Заявка отклонена }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sellers/{id}/verify-bank-account:
    post:
      tags: [seller-admin]
      operationId: verifySellerBankAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Реквизиты подтверждены }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/admin/sellers/{id}/suspend:
    post:
      tags: [seller-admin]
      operationId: suspendSeller
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "204": { description: Продавец приостановлен }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sellers/{id}/reinstate:
    post:
      tags: [seller-admin]
      operationId: reinstateSeller
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Продавец восстановлен }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sellers/{id}/terminate:
    post:
      tags: [seller-admin]
      operationId: terminateSeller
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "204": { description: Сотрудничество прекращено }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sellers/{id}/commission-overrides/{category_id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/CategoryID"
    put:
      tags: [seller-admin]
      operationId: setSellerCommissionOverride
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rate" }
      responses:
        "204": { description: Индивидуальная ставка установлена }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [seller-admin]
      operationId: clearSellerCommissionOverride
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Индивидуальная ставка снята }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/category-commissions/{category_id}:
    put:
      tags: [seller-admin]
      operationId: setCategoryCommission
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CategoryID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rate" }
      responses:
        "204": { description: Базовая ставка категории установлена }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/catalog/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      description: Плоское дерево категорий, отсортированное по глубине и названию.
      responses:
        "200":
          description: Дерево категорий
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryNode" }
  /api/v1/catalog/categories/{id}:
    get:
      tags: [catalog]
      operationId: getCategory
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Категория с путём и эффективной схемой атрибутов (собственные плюс унаследованные)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog/categories/{id}/facets:
    get:
      tags: [search]
      operationId: getCategoryFacets
      description: Фасеты по опубликованным товарам поддерева категории с учётом текущих фильтров.
      parameters:
        - $ref: "#/components/parameters/PathID"
        - { name: q, in: query, schema: { type: string } }
        - { name: filters, in: query, schema: { type: string }, description: "Список `код:значение`, значения через `|`, пары через запятую" }
        - { name: price_min, in: query, schema: { type: integer, format: int64 } }
        - { name: price_max, in: query, schema: { type: integer, format: int64 } }
        - { name: seller, in: query, schema: { type: string, format: uuid } }
        - { name: condition, in: query, schema: { type: string, enum: [new, used, refurbished] } }
        - { name: in_stock, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Фасеты категории
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facets" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/catalog/products/{id}:
    get:
      tags: [catalog]
      operationId: getProduct
      description: Опубликованная карточка доступна всем; черновики и карточки на модерации — владельцу и модератору.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Карточка товара
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/catalog/products/{id}/offers:
    get:
      tags: [catalog]
      operationId: listProductOffers
      description: Активные офферы продавцов с правом продажи, отсортированные по цене.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Офферы товара
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/search/products:
    get:
      tags: [search]
      operationId: searchProducts
